services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: python3 -m uvicorn bioguard.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BG_PREDICTION_TIMEOUT_SECONDS: "30"
      NVIDIA_VISIBLE_DEVICES: all
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    command: celery -A worker.celery_app:celery_app worker --loglevel=info --concurrency=4
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      BG_MAX_SMILES_LENGTH: "4096"
      BG_MAX_HEAVY_ATOMS: "256"
      BG_TASK_SOFT_TIME_LIMIT: "45"
      BG_TASK_TIME_LIMIT: "60"
    depends_on:
      redis:
        condition: service_healthy
